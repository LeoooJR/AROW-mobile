appId: com.leooojrrr.AROWmobile
---
# LOCATION_ACCESS chooses coarse access (allow) or complete denial (deny).
# Attempt Settings first; retain evidence when Android guards a mock provider.
- evalScript: ${output.locationProviderGuard = false}
- pressKey: Home
- launchApp:
    appId: com.android.settings
    stopApp: false
    permissions: {}
- extendedWaitUntil:
    visible: "(Search Settings|Location permission|App permissions)"
    timeout: 30000
- runFlow:
    when:
      visible: "App permissions"
    commands:
      - tapOn: "Location"
- runFlow:
    when:
      notVisible:
        id: "com.android.permissioncontroller:id/deny_radio_button"
    commands:
      - scrollUntilVisible:
          element: "Apps"
          direction: DOWN
      - tapOn: "Apps"
      - tapOn: "See all [0-9]+ apps"
      - scrollUntilVisible:
          element: "AROW-mobile"
          direction: DOWN
      - tapOn: "AROW-mobile"
      - tapOn: "Permissions"
      - tapOn: "Location"
- runFlow:
    when:
      notVisible: "AROW-mobile is a provider of location services.*"
    commands:
      - assertVisible: "AROW-mobile"
      - runFlow:
          when:
            true: ${LOCATION_ACCESS === 'deny'}
          commands:
            - tapOn:
                id: "com.android.permissioncontroller:id/deny_radio_button"
            - runFlow:
                when:
                  visible: "Don.t allow anyway"
                commands:
                  - tapOn: "Don.t allow anyway"
      - runFlow:
          when:
            true: ${LOCATION_ACCESS === 'allow'}
          commands:
            - runFlow:
                when:
                  visible:
                    id: "com.android.permissioncontroller:id/allow_foreground_only_radio_button"
                    checked: false
                commands:
                  - tapOn:
                      id: "com.android.permissioncontroller:id/allow_foreground_only_radio_button"
            - runFlow:
                when:
                  visible:
                    id: "android:id/switch_widget"
                    checked: true
                commands:
                  - tapOn:
                      id: "android:id/switch_widget"
- runFlow:
    when:
      visible: "AROW-mobile is a provider of location services.*"
    commands:
      - takeScreenshot: location-settings-provider-guard
      - tapOn: "OK"
      - evalScript: ${output.locationProviderGuard = true}
      # The test API still exercises Android's real permission-change restart.
      # Do not change mock selection or Developer options to bypass the guard.
      - setPermissions:
          permissions:
            android.permission.ACCESS_FINE_LOCATION: deny
            android.permission.ACCESS_COARSE_LOCATION: "${LOCATION_ACCESS === 'deny' ? 'deny' : 'allow'}"
- runFlow:
    when:
      true: ${!output.locationProviderGuard && LOCATION_ACCESS === 'allow'}
    commands:
      - assertVisible:
          id: "android:id/switch_widget"
          checked: false
- runFlow:
    when:
      true: ${!output.locationProviderGuard && LOCATION_ACCESS === 'deny'}
    commands:
      - assertVisible:
          id: "com.android.permissioncontroller:id/deny_radio_button"
          checked: true
