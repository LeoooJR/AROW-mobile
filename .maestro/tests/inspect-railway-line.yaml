appId: com.leooojrrr.AROWmobile
name: Inspect a railway line
tags:
  - journey
  - map
  - railway
---
- stopApp
- setPermissions:
    permissions:
      location: allow
- openLink: "exp+arow-mobile://expo-development-client/?url=http%3A%2F%2F10.0.2.2%3A8081"
- extendedWaitUntil:
    visible:
      id: "arow-map"
    timeout: 60000
- setLocation:
    latitude: 49.4364444709
    longitude: 1.121872878
- extendedWaitUntil:
    visible: "(Connectée|Active)"
    timeout: 30000
- waitForAnimationToEnd
# This point follows the Paris–Le Havre main line north of the centered fix.
- tapOn:
    point: "45%,42%"
- extendedWaitUntil:
    visible: "Ligne de Paris-St-Lazare au Havre"
    timeout: 10000
- assertVisible: "340000"
- assertVisible: "1"
- assertVisible: "000\\+031 → 227\\+918"
- tapOn:
    id: "close-railway-details"
- assertNotVisible: "Ligne de Paris-St-Lazare au Havre"
