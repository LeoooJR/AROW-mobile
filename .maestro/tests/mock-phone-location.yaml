appId: com.leooojrrr.AROWmobile
name: Resolve a milestone with location access
tags:
  - journey
  - location
  - map
  - milestone
  - railway
---
# Preserve the development client's remembered Metro connection. Grant location
# explicitly so repeated runs do not revoke the AVD's saved permission.
- stopApp
- setPermissions:
    permissions:
      location: allow
- openLink: "exp+arow-mobile://expo-development-client/?url=http%3A%2F%2F10.0.2.2%3A8081"
- extendedWaitUntil:
    visible:
      id: "arow-map"
    timeout: 60000
- assertVisible:
    id: "arow-map"
- assertVisible:
    id: "location-status"
- setLocation:
    latitude: 45.74491
    longitude: 4.86234
- extendedWaitUntil:
    visible: ".*45\\.74491 N.*"
    timeout: 30000
- extendedWaitUntil:
    visible: "(Connectée|Active)"
    timeout: 30000

# Resolve the production milestone through the route-owned point search.
- tapOn:
    id: "open-point-search"
- assertVisible: "Rechercher un point"
- assertVisible: "Ligne, section, puis repère kilométrique."
- tapOn:
    id: "line-search-input"
- inputText: "893000"
- extendedWaitUntil:
    visible: "Ligne de Collonges-Fontaines à Lyon-Guillotière"
    timeout: 30000
- tapOn:
    id: "line-result-893000"
- assertVisible: "Section 1"
- tapOn:
    id: "milestone-kilometer-input"
- inputText: "509"
- tapOn:
    id: "milestone-metric-input"
- inputText: "000"
- pressKey: Enter
- assertVisible: "Point résolu"
- tapOn:
    id: "use-selected-point"
- assertNotVisible:
    id: "point-search-sheet"
- extendedWaitUntil:
    visible: "PK 509\\+000"
    timeout: 10000
- assertVisible: ".*45\\.74744 N.*4\\.85933 E.*"
- assertVisible:
    id: "simulation-primary-action"
- assertVisible:
    id: "simulation-play-pause"
- tapOn:
    id: "simulation-play-pause"
# Without selecting AROW as the developer mock-location app, the action fails
# before the milestone is looked up or a foreground service is started.
- extendedWaitUntil:
    visible: "Sélectionnez AROW comme application de position fictive"
    timeout: 10000
- assertVisible: "Réessayer la simulation"
- assertVisible: "PK 509\\+000"
- assertVisible: ".*45\\.74744 N.*4\\.85933 E.*"
- tapOn:
    id: "close-map-feature-details"
- assertNotVisible:
    id: "simulation-play-pause"
- extendedWaitUntil:
    visible: "(Connectée|Active)"
    timeout: 10000
- assertNotVisible: "Sélectionnez AROW comme application de position fictive"
