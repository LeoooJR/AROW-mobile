appId: com.leooojrrr.AROWmobile
name: Inspect a railway line after granting location access
tags:
  - journey
  - location
  - map
  - railway
---
# Preserve the development client's remembered Metro connection while following
# the first-use journey from location permission to railway exploration.
- stopApp
- setPermissions:
    permissions:
      location: unset
- openLink: "exp+arow-mobile://expo-development-client/?url=http%3A%2F%2F10.0.2.2%3A8081"
- extendedWaitUntil:
    visible:
      id: "arow-map"
    timeout: 60000
- assertVisible:
    id: "arow-map"
- assertVisible:
    id: "location-status"
- assertVisible: "(Autorisation requise|Accès refusé)"
- tapOn:
    id: "location-status"
- assertVisible:
    id: ".*permission_allow(_foreground_only)?_button"
- tapOn:
    id: ".*permission_allow(_foreground_only)?_button"
- assertNotVisible: "(Autorisation requise|Accès refusé)"
- assertVisible:
    id: "location-status"
- setLocation:
    latitude: 49.4364444709
    longitude: 1.121872878
- extendedWaitUntil:
    visible: ".*49\\.43644 N.*"
    timeout: 30000
- extendedWaitUntil:
    visible: "(Connectée|Active)"
    timeout: 30000
- waitForAnimationToEnd
# This point follows the Paris–Le Havre main line north of the centered fix.
- tapOn:
    point: "510,1008"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Ligne de Paris-St-Lazare au Havre"
    timeout: 10000
- assertVisible: "340000"
- assertVisible: "1"
- assertVisible: "000\\+031 → 227\\+918"
- tapOn:
    id: "close-railway-details"
- assertNotVisible: "Ligne de Paris-St-Lazare au Havre"
