appId: com.leooojrrr.AROWmobile
name: Inspect railway and milestone map features after granting location access
tags:
  - journey
  - location
  - map
  - milestone
  - railway
---
# Preserve the development client's remembered Metro connection while following
# the first-use journey from location permission to map-feature exploration.
- stopApp
- setPermissions:
    permissions:
      location: unset
- openLink: "exp+arow-mobile://expo-development-client/?url=http%3A%2F%2F10.0.2.2%3A8081"
- extendedWaitUntil:
    visible:
      id: "arow-map"
    timeout: 60000
- assertVisible:
    id: "arow-map"
- assertVisible:
    id: "location-status"
- assertVisible: "(Autorisation requise|Accès refusé)"
- tapOn:
    id: "location-status"
- assertVisible:
    id: ".*permission_allow(_foreground_only)?_button"
- tapOn:
    id: ".*permission_allow(_foreground_only)?_button"
- assertNotVisible: "(Autorisation requise|Accès refusé)"
- assertVisible:
    id: "location-status"
- setLocation:
    latitude: 45.74491
    longitude: 4.86234
- extendedWaitUntil:
    visible: ".*45\\.74491 N.*"
    timeout: 30000
- extendedWaitUntil:
    visible: "(Connectée|Active)"
    timeout: 30000
- waitForAnimationToEnd
# The 509+000 milestone is visible northwest of the centered fix after the
# fresh-start status bar settles.
- tapOn:
    point: "172,810"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "PK 509\\+000"
    timeout: 10000
- assertVisible: "POINT KILOMÉTRIQUE"
- assertVisible: "893000"
- assertVisible: "1"
- assertVisible: "509\\+000"
- assertVisible: ".*45\\.74744 N.*4\\.85933 E.*"
# Replace the milestone selection with its parent railway section.
- tapOn:
    point: "260,300"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Ligne de Collonges-Fontaines à Lyon-Guillotière"
    timeout: 10000
- assertNotVisible: "PK 509\\+000"
- assertVisible: "893000"
- assertVisible: "1"
- assertVisible: "499\\+752 → 511\\+605"
# A selected railway remains below overlapping milestones for rendering and
# press dispatch, so the milestone can replace the railway selection.
- tapOn:
    point: "172,810"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "PK 509\\+000"
    timeout: 10000
- assertNotVisible: "Ligne de Collonges-Fontaines à Lyon-Guillotière"
- assertVisible: "POINT KILOMÉTRIQUE"
- assertVisible: ".*45\\.74744 N.*4\\.85933 E.*"
- assertNotVisible:
    id: "simulation-play-pause"
- tapOn:
    id: "close-map-feature-details"
- assertNotVisible: "PK 509\\+000"

# Resolve the same production milestone through the route-owned point search.
- tapOn:
    id: "open-point-search"
- assertVisible: "Rechercher un point"
- assertVisible: "Ligne, section, puis repère kilométrique."
- tapOn:
    id: "line-search-input"
- inputText: "893000"
- assertVisible: "Ligne de Collonges-Fontaines à Lyon-Guillotière"
- tapOn:
    id: "line-result-893000"
- assertVisible: "Section 1"
- tapOn:
    id: "milestone-kilometer-input"
- inputText: "509"
- tapOn:
    id: "milestone-metric-input"
- inputText: "000"
- pressKey: Enter
- assertVisible: "Point résolu"
- tapOn:
    id: "use-selected-point"
- assertNotVisible:
    id: "point-search-sheet"
- extendedWaitUntil:
    visible: "PK 509\\+000"
    timeout: 10000
- assertVisible: ".*45\\.74744 N.*4\\.85933 E.*"
- assertVisible:
    id: "simulation-primary-action"
- assertVisible:
    id: "simulation-play-pause"
- tapOn:
    id: "simulation-play-pause"
# Starting the simulation is intentionally inert in this delivery.
- assertVisible:
    id: "simulation-play-pause"
- assertVisible: "PK 509\\+000"
- assertVisible: ".*45\\.74744 N.*4\\.85933 E.*"
- tapOn:
    id: "close-map-feature-details"
- assertNotVisible:
    id: "simulation-play-pause"
