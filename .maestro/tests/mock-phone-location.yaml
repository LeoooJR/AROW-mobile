appId: com.leooojrrr.AROWmobile
name: Mock phone location
tags:
  - journey
  - location
---
# This goal-driven journey currently covers reaching the railway map and
# granting location permission. Extend it as coordinate selection and mock
# location activation become available; do not clear the development client's
# remembered Metro connection.
- setPermissions:
    permissions:
      location: unset
- openLink: "exp+arow-mobile://expo-development-client/?url=http%3A%2F%2F10.0.2.2%3A8081"
- extendedWaitUntil:
    visible:
      id: "arow-map"
    timeout: 60000
- assertVisible:
    id: "arow-map"
- assertVisible:
    id: "location-status"
- assertVisible: "(Autorisation requise|Accès refusé)"
- tapOn:
    id: "location-status"
- assertVisible:
    id: ".*permission_allow(_foreground_only)?_button"
- tapOn:
    id: ".*permission_allow(_foreground_only)?_button"
- assertNotVisible: "(Autorisation requise|Accès refusé)"
- assertVisible:
    id: "location-status"
