appId: com.leooojrrr.AROWmobile
name: Select railway and milestone map features
tags:
  - feature
  - map
  - milestone
  - railway
---
# Initialize this feature independently from the permission and search journey.
- stopApp
- setPermissions:
    permissions:
      location: allow
- openLink: "exp+arow-mobile://expo-development-client/?url=http%3A%2F%2F10.0.2.2%3A8081"
# Wait for this cold launch; a second immediate URL can restart React while
# the Expo native runtime is still initializing.
- extendedWaitUntil:
    visible:
      id: "arow-map"
    timeout: 60000
- setLocation:
    latitude: 45.74491
    longitude: 4.86234
- extendedWaitUntil:
    visible: ".*45\\.74491 N.*"
    timeout: 30000
- extendedWaitUntil:
    visible: "(Connectée|Active)"
    timeout: 30000
- tapOn:
    id: "center-location"
- waitForAnimationToEnd
# The 509+000 milestone is visible northwest of the centered fix after the
# fresh-start status bar settles.
- tapOn:
    point: "16%,32%"
# Android system bars can shift this map target before the camera settles.
- runFlow:
    when:
      notVisible: "PK 509\\+000"
    commands:
      - tapOn:
          point: "16%,33%"
- extendedWaitUntil:
    visible: "PK 509\\+000"
    timeout: 10000
- assertVisible: "POINT KILOMÉTRIQUE"
- assertVisible: "893000"
- assertVisible: "1"
- assertVisible: "509\\+000"
- assertVisible: ".*45\\.74744 N.*4\\.85933 E.*"
# Browse the adjacent recorded points and both section boundaries without wrapping.
- extendedWaitUntil:
    visible: "96 sur 124"
    timeout: 10000
- assertVisible:
    id: "use-map-milestone"
- assertNotVisible:
    id: "simulation-play-pause"
- tapOn:
    id: "use-map-milestone"
- assertVisible: "PK 509\\+000"
- assertVisible: "Démarrer la simulation"
- tapOn:
    id: "previous-milestone"
- assertVisible: "PK 508\\+900"
- assertVisible: "95 sur 124"
- assertNotVisible:
    id: "simulation-play-pause"
- tapOn:
    id: "next-milestone"
- assertVisible: "PK 509\\+000"
# Search near each boundary rather than traversing all 124 recorded points.
- runFlow:
    file: ../flows/resolve-milestone.yaml
    env:
      KILOMETER: "511"
      METRIC: "500"
- assertVisible: "123 sur 124"
- tapOn:
    id: "next-milestone"
- assertVisible: "PK 511\\+600"
- assertVisible: "124 sur 124"
- assertVisible:
    id: "next-milestone"
    enabled: false
- runFlow:
    file: ../flows/resolve-milestone.yaml
    env:
      KILOMETER: "499"
      METRIC: "800"
- assertVisible: "2 sur 124"
- tapOn:
    id: "previous-milestone"
- assertVisible: "PK 499\\+752"
- assertVisible: "1 sur 124"
- assertVisible:
    id: "previous-milestone"
    enabled: false
- assertNotVisible:
    id: "simulation-play-pause"
- tapOn:
    id: "center-location"
- waitForAnimationToEnd
# Dense hectometre dots correctly take press priority. Hide them while selecting
# the parent railway, then restore them to verify overlap priority below.
- tapOn:
    id: "map-layers-button"
- tapOn:
    id: "milestones-layer-switch"
- swipe:
    start: "50%,84%"
    end: "50%,98%"
- waitForAnimationToEnd
- tapOn:
    point: "24%,13%"
- extendedWaitUntil:
    visible: "Ligne de Collonges-Fontaines à Lyon-Guillotière"
    timeout: 10000
- tapOn:
    id: "map-layers-button"
- tapOn:
    id: "milestones-layer-switch"
- swipe:
    start: "50%,84%"
    end: "50%,98%"
- waitForAnimationToEnd
- assertNotVisible: "PK 509\\+000"
- assertVisible: "893000"
- assertVisible: "1"
- assertVisible: "499\\+752 → 511\\+605"
- assertNotVisible:
    id: "use-map-milestone"
- extendedWaitUntil:
    visible: "Centrer la carte sur le premier repère, .*"
    timeout: 10000
- tapOn:
    id: "first-railway-milestone"
- assertVisible: "Ligne de Collonges-Fontaines à Lyon-Guillotière"
- assertNotVisible: "POINT KILOMÉTRIQUE"
- tapOn:
    id: "first-railway-milestone"
- tapOn:
    id: "last-railway-milestone"
- assertVisible: "Ligne de Collonges-Fontaines à Lyon-Guillotière"
- assertVisible: "499\\+752 → 511\\+605"
# Restore the live-position camera before checking overlapping feature presses.
- tapOn:
    id: "center-location"
- waitForAnimationToEnd
# A selected railway remains below overlapping milestones for rendering and
# press dispatch, so the milestone can replace the railway selection.
- tapOn:
    point: "16%,32%"
- runFlow:
    when:
      notVisible: "PK 509\\+000"
    commands:
      - tapOn:
          point: "16%,33%"
- extendedWaitUntil:
    visible: "PK 509\\+000"
    timeout: 10000
- assertNotVisible: "Ligne de Collonges-Fontaines à Lyon-Guillotière"
- assertVisible: "POINT KILOMÉTRIQUE"
- assertVisible: ".*45\\.74744 N.*4\\.85933 E.*"
- assertNotVisible:
    id: "simulation-play-pause"
- tapOn:
    id: "use-map-milestone"
- assertVisible: "PK 509\\+000"
- assertVisible: "Démarrer la simulation"
- tapOn:
    id: "close-map-feature-details"
- assertNotVisible: "PK 509\\+000"
- assertNotVisible:
    id: "simulation-play-pause"
