executionOrder:
  continueOnFailure: false
  flowsOrder:
    - Recover location access after denial
    - Resolve a milestone with location access
    - Step milestone kilometers within a section
    - Select railway and milestone map features
    - Manage railway map layer visibility
    - Use the distraction-free map-only mode
    - Select AROW as the mock location app
    - Simulate milestones across permission API changes
    - Recover simulation after location permission changes in Settings
    - Stop simulation when Location is disabled
    - Recover after mock-location selection is removed
    - Manage simulation notification visibility
    - Stop background simulation after dismissing the task
    - Keep the foreground map usable after connectivity loss
flows:
  - "journeys/*"
  - "features/*"
  # Explicit system setup between missing-provider and active-simulation tests.
  - "setup/select-mock-location-provider.yaml"
